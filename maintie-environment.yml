name: maintie-environment
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pytorch=1.13
  - pytorch-lightning=1.8
  - transformers=4.21
  - datasets=2.5
  - scikit-learn=1.1
  - pandas=1.5
  - numpy=1.23
  - tqdm=4.64
  - matplotlib=3.6
  - seaborn=0.12
  - hydra-core=1.2
  - omegaconf=2.2
  - tensorboard=2.10
  - pip
  - pip:
    - azure-ml-sdk
    - azureml-core
    - azureml-widgets
    - jsonlines==3.1.0
    - spacy==3.4.1
    - tokenizers==0.12.1
